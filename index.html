<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102b35">
  <meta name="description" content="Carte interactive et repérage en coordonnées Merchich Nord et Sud.">
  <title>MERCHICH MAP</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { --ink:#102b35; --accent:#e6a23c; --paper:#f6f8f8; --muted:#64757b; --line:#dce4e5; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--paper); }
    body { display:flex; flex-direction:column; }
    header { background:var(--ink); color:white; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; z-index:1000; }
    .brand { font-weight:800; letter-spacing:.08em; font-size:17px; }
    .sub { font-size:11px; opacity:.75; margin-top:2px; }
    .top-actions { display:flex; gap:8px; }
    button, .file-label { border:0; border-radius:10px; padding:10px 12px; font-weight:650; cursor:pointer; background:#e8eff0; color:var(--ink); }
    button.primary { background:var(--accent); color:#182a2e; }
    button.dark { background:#25444e; color:white; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    #map { flex:1; min-height:260px; z-index:1; }
    .panel { background:white; border-top:1px solid var(--line); padding:12px 14px calc(12px + env(safe-area-inset-bottom)); box-shadow:0 -4px 18px #102b3510; z-index:500; }
    .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
    .search-wrap { display:flex; flex:1; min-width:0; gap:6px; }
    input { min-width:0; width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; background:white; }
    .coords { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .coord { background:#f2f6f6; border:1px solid var(--line); border-radius:12px; padding:10px 12px; min-width:0; }
    .coord .label { color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.04em; }
    .coord .value { font-size:clamp(18px,4vw,24px); font-weight:800; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; margin-top:2px; }
    .meta { display:flex; flex-wrap:wrap; gap:7px 14px; margin-top:9px; color:var(--muted); font-size:12px; }
    .status { margin-top:8px; font-size:12px; line-height:1.4; color:var(--muted); }
    .status.warn { color:#9b5b00; }
    .status.good { color:#16734a; }
    .bottom-row { display:flex; justify-content:space-between; gap:8px; margin-top:10px; }
    .bottom-row button { flex:1; }
    .leaflet-control-attribution { font-size:9px !important; }
    .leaflet-popup-content { font-size:13px; }
    @media (min-width:850px) {
      body { display:grid; grid-template-columns:minmax(0,1fr) 370px; grid-template-rows:62px minmax(0,1fr); }
      header { grid-column:1 / -1; }
      #map { grid-column:1; grid-row:2; }
      .panel { grid-column:2; grid-row:2; border-top:0; border-left:1px solid var(--line); padding:18px; overflow:auto; }
      .toolbar { flex-wrap:wrap; }
      .search-wrap { flex-basis:100%; }
      .coords { grid-template-columns:1fr; }
    }
    @media (max-width:420px) {
      header { padding:10px 12px; }
      .brand { font-size:15px; }
      .top-actions button { padding:9px 10px; font-size:12px; }
      .panel { padding-left:10px; padding-right:10px; }
    }
  </style>
</head>
<body>
<header>
  <div>
    <div class="brand">MERCHICH MAP</div>
    <div class="sub">Repérage • Maroc • Coordonnées en mètres</div>
  </div>
  <div class="top-actions">
    <button class="dark" id="installBtn" hidden>Installer</button>
    <button class="primary" id="locateBtn">◎ Ma position</button>
  </div>
</header>
<div id="map" aria-label="Carte interactive"></div>
<section class="panel">
  <div class="toolbar">
    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="Rechercher une ville ou un lieu…" autocomplete="off">
      <button id="searchBtn" class="primary">Chercher</button>
    </div>
    <button id="layersBtn" title="Changer de fond">Fond</button>
  </div>
  <div class="coords">
    <div class="coord"><div class="label">X — EST (m)</div><div class="value" id="xVal">—</div></div>
    <div class="coord"><div class="label">Y — NORD (m)</div><div class="value" id="yVal">—</div></div>
  </div>
  <div class="meta">
    <span id="zoneVal">Zone : —</span>
    <span id="accuracyVal">Précision méthode : —</span>
  </div>
  <div class="status" id="status">Autorise la localisation pour ouvrir la carte sur ta position, ou touche directement la carte pour choisir un point.</div>
  <div class="bottom-row">
    <button id="copyBtn">Copier X / Y</button>
    <button id="saveBtn" class="primary">Enregistrer le point</button>
    <button id="exportBtn">Exporter CSV</button>
  </div>
  <div class="status" id="savedCount">Aucun point enregistré.</div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/proj4@2.11.0/dist/proj4.js"></script>
<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const status = (msg, type="") => { $("status").textContent = msg; $("status").className = "status " + type; };

  // EPSG registry definitions: Merchich / Nord Maroc (26191), Sud Maroc (26192).
  // The +towgs84 values implement EPSG operation 1166 (Merchich -> WGS 84):
  // geocentric translations +31 m, +146 m, +47 m; EPSG stated accuracy 7 m.
  proj4.defs("EPSG:26191", "+proj=lcc +lat_1=33.3 +lat_0=33.3 +lon_0=-5.4 +k_0=0.999625769 +x_0=500000 +y_0=300000 +ellps=clrk80ign +towgs84=31,146,47,0,0,0,0 +units=m +no_defs +type=crs");
  proj4.defs("EPSG:26192", "+proj=lcc +lat_1=29.7 +lat_0=29.7 +lon_0=-5.4 +k_0=0.999615596 +x_0=500000 +y_0=300000 +ellps=clrk80ign +towgs84=31,146,47,0,0,0,0 +units=m +no_defs +type=crs");

  const map = L.map("map", { zoomControl:true }).setView([31.7917, -7.0926], 5);
  const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  });
  const imagery = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    maxZoom:19, attribution:'Tiles © Esri'
  });
  let satellite = true;
  imagery.addTo(map);
  let selectedMarker = null, current = null, userMarker = null;
  const saved = [];

  function inEPSG1166Area(lat, lon) {
    return lat >= 27.66 && lat <= 35.97 && lon >= -13.24 && lon <= -1.01;
  }
  function convert(lat, lon) {
    // EPSG:26191 area north of 31°30'N; EPSG:26192 area south.
    const epsg = lat >= 31.5 ? "EPSG:26191" : "EPSG:26192";
    const zone = lat >= 31.5 ? "Merchich / Nord Maroc (EPSG:26191)" : "Merchich / Sud Maroc (EPSG:26192)";
    const xy = proj4("EPSG:4326", epsg, [lon, lat]);
    return { x:xy[0], y:xy[1], epsg, zone };
  }
  function showPoint(lat, lon, label="Point sélectionné") {
    const c = convert(lat, lon);
    current = { lat, lon, ...c, label };
    if (selectedMarker) map.removeLayer(selectedMarker);
    selectedMarker = L.marker([lat,lon]).addTo(map).bindPopup(
      `<b>${label}</b><br>X : ${c.x.toFixed(2)} m<br>Y : ${c.y.toFixed(2)} m`
    ).openPopup();
    $("xVal").textContent = c.x.toFixed(2);
    $("yVal").textContent = c.y.toFixed(2);
    $("zoneVal").textContent = "Zone : " + c.zone;
    $("accuracyVal").textContent = "EPSG 1166 : 7 m (indicatif)";
    if (!inEPSG1166Area(lat,lon)) {
      status("Attention : ce point est hors de l'emprise déclarée de l'opération EPSG 1166. Les coordonnées sont calculées, mais la précision de 7 m n'est pas applicable ici.", "warn");
    } else {
      status("Coordonnées calculées. Transformation EPSG 1166 (Merchich → WGS 84), précision publiée : 7 m. Adapté au repérage, pas à un bornage cadastral.", "good");
    }
  }
  map.on("click", e => showPoint(e.latlng.lat, e.latlng.lng));
  $("locateBtn").addEventListener("click", locate);
  function locate() {
    if (!navigator.geolocation) { status("La géolocalisation n'est pas disponible sur cet appareil.", "warn"); return; }
    status("Recherche de ta position GPS…");
    navigator.geolocation.getCurrentPosition(pos => {
      const lat = pos.coords.latitude, lon = pos.coords.longitude;
      const acc = Math.round(pos.coords.accuracy);
      map.setView([lat,lon], 17);
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.circleMarker([lat,lon], {radius:8,color:"#0879d1",fillColor:"#36a9ff",fillOpacity:.95,weight:3}).addTo(map)
        .bindPopup("Ta position GPS<br>Précision GPS annoncée : ±"+acc+" m");
      showPoint(lat,lon,"Ma position GPS");
      status("Position GPS reçue (précision annoncée par l'appareil : ±"+acc+" m). La précision finale dépend aussi du GPS, de la carte et de la transformation.", "good");
    }, err => {
      const messages = {1:"Autorisation de localisation refusée. Tu peux quand même cliquer sur la carte.",2:"Position GPS indisponible. Tu peux cliquer sur la carte.",3:"Délai GPS dépassé. Réessaie ou clique sur la carte."};
      status(messages[err.code] || "Impossible d'obtenir la position GPS.", "warn");
    }, {enableHighAccuracy:true, timeout:15000, maximumAge:30000});
  }
  $("layersBtn").addEventListener("click", () => {
    if (satellite) { map.removeLayer(imagery); osm.addTo(map); satellite=false; $("layersBtn").textContent="Satellite"; }
    else { map.removeLayer(osm); imagery.addTo(map); satellite=true; $("layersBtn").textContent="Carte"; }
  });
  async function search() {
    const q = $("searchInput").value.trim();
    if (!q) return;
    status("Recherche du lieu…");
    try {
      const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=ma&q="+encodeURIComponent(q);
      const res = await fetch(url, {headers:{"Accept":"application/json"}});
      if (!res.ok) throw new Error("Recherche indisponible");
      const data = await res.json();
      if (!data.length) { status("Aucun résultat trouvé au Maroc. Essaie avec un nom plus précis.", "warn"); return; }
      const lat=Number(data[0].lat), lon=Number(data[0].lon);
      map.setView([lat,lon], 16);
      showPoint(lat,lon,data[0].name || q);
    } catch(e) { status("Recherche momentanément indisponible. Tu peux naviguer sur la carte manuellement.", "warn"); }
  }
  $("searchBtn").addEventListener("click", search);
  $("searchInput").addEventListener("keydown", e => { if(e.key==="Enter") search(); });
  $("copyBtn").addEventListener("click", async () => {
    if (!current) { status("Sélectionne d'abord un point.", "warn"); return; }
    const txt = `X=${current.x.toFixed(2)} m, Y=${current.y.toFixed(2)} m (${current.epsg})`;
    try { await navigator.clipboard.writeText(txt); status("Coordonnées copiées : "+txt, "good"); }
    catch { status(txt, "good"); }
  });
  $("saveBtn").addEventListener("click", () => {
    if (!current) { status("Sélectionne d'abord un point.", "warn"); return; }
    saved.push({...current, n:saved.length+1});
    $("savedCount").textContent = saved.length+" point(s) enregistré(s) dans cette session.";
    status("Point enregistré dans la liste temporaire.", "good");
  });
  $("exportBtn").addEventListener("click", () => {
    if (!saved.length) { status("Enregistre au moins un point avant l'export.", "warn"); return; }
    const rows = [["Point","Nom","X_Est_m","Y_Nord_m","EPSG","Latitude_WGS84","Longitude_WGS84"]];
    saved.forEach(p => rows.push([p.n,p.label,p.x.toFixed(2),p.y.toFixed(2),p.epsg,p.lat,p.lon]));
    const csv = "\uFEFF" + rows.map(r => r.map(v => `"${String(v).replaceAll('"','""')}"`).join(";")).join("\r\n");
    const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
    const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="merchich-map-points.csv"; a.click(); URL.revokeObjectURL(a.href);
  });

  // Open on current position when permission is granted; otherwise ask once.
  if (navigator.geolocation) locate();
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
  }
  let deferredPrompt;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt=e; $("installBtn").hidden=false; });
  $("installBtn").addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; $("installBtn").hidden=true;
  });
})();
</script>
</body>
</html>
